[build]
  publish = "."
  functions = "functions"

[functions]
  node_bundler = "esbuild"

# Dynamic Memory Catcher affiliate pages: /memory-catcher/<slug> is served by
# the edge function, which looks the slug up in Supabase and injects that
# franchisee's data into the one template (index.html). Unknown/inactive slug
# -> 404. See netlify/edge-functions/memory-catcher.js.
[[edge_functions]]
  path = "/memory-catcher/:slug"
  function = "memory-catcher"

