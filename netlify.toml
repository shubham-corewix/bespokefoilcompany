# Netlify configuration for The Bespoke Foil Company site
# Hand-coded static pages. The only "build" step regenerates the discovery
# files (sitemap.xml, sitemap.html, robots.txt, llms.txt) from _redirects so
# they can never drift out of sync with the live routes.
# URL routing (clean URLs + homepage) is handled in the _redirects file.

[build]
  publish = "."
  command = "node scripts/generate-sitemaps.js && node scripts/check-internal-links.js && node scripts/check-analytics.js"

# Security + caching headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Long cache for versioned image/font assets (they don't change)
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Shorter cache for the shared stylesheet (may change during the build)
[[headers]]
  for = "/shared/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# Discovery files are regenerated every build - keep them fresh
[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Cache-Control = "public, max-age=3600"
[[headers]]
  for = "/robots.txt"
  [headers.values]
    Cache-Control = "public, max-age=3600"
[[headers]]
  for = "/llms.txt"
  [headers.values]
    Content-Type = "text/markdown; charset=utf-8"
    Cache-Control = "public, max-age=3600"

[functions]
  directory = "functions"
  node_bundler = "esbuild"

# Weekly retention sweep for upload-portal media. Starts in DRY RUN: it logs
# what it would delete and deletes nothing until UPLOAD_PURGE_ENABLED=true.
[functions."upload-portal-purge"]
  schedule = "0 3 * * 1"

[[edge_functions]]
  path = "/memory-catcher/:slug"
  function = "memory-catcher"

# sitemap.xml is served at request time, not built. It merges the static routes
# (sitemap-static.json, written by the build from _redirects) with the dynamic
# franchise regions and blog posts in Supabase. The build must NOT write a
# sitemap.xml file - a real file on this path would win over the function.
[[edge_functions]]
  path = "/sitemap.xml"
  function = "sitemap"

# Franchise regions and blog posts are served from Supabase at request time -
# one template each, no static generation. Both return a REAL 404 when the slug
# has no row, and both inject SEO and Open Graph tags server-side (social
# scrapers do not run JavaScript, so client-side meta would not work).
[[edge_functions]]
  path = "/franchises/:slug"
  function = "franchise-region"

[[edge_functions]]
  path = "/post/:slug"
  function = "blog-post"
