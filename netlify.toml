# Netlify configuration for The Bespoke Foil Company site
# Hand-coded static pages. The only "build" step regenerates the discovery
# files (sitemap.xml, sitemap.html, robots.txt, llms.txt) from _redirects so
# they can never drift out of sync with the live routes.
# URL routing (clean URLs + homepage) is handled in the _redirects file.

[build]
  publish = "."
  command = "node scripts/generate-sitemaps.js && node scripts/check-internal-links.js"
  functions = "functions"

[functions]
  node_bundler = "esbuild"

# Dynamic affiliate PDPs: /memory-catcher/:slug injects franchisee data into
# memory-catcher.html. Unknown/inactive slug -> memory-catcher-404.html.
[[edge_functions]]
  path = "/memory-catcher/:slug"
  function = "memory-catcher"

# Security + caching headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Long cache for versioned image/font assets (they don't change)
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Shorter cache for the shared stylesheet (may change during the build)
[[headers]]
  for = "/shared/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# Discovery files are regenerated every build - keep them fresh
[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Cache-Control = "public, max-age=3600"
[[headers]]
  for = "/robots.txt"
  [headers.values]
    Cache-Control = "public, max-age=3600"
[[headers]]
  for = "/llms.txt"
  [headers.values]
    Content-Type = "text/markdown; charset=utf-8"
    Cache-Control = "public, max-age=3600"
